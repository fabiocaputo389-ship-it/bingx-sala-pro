<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BingX Elite Signal Room Pro — Timer & Segnali Fine Candela</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --panel-2: #162033;
      --border: #24324d;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 14px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .brand-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .badge-bx {
      background: #2563eb;
      color: #fff;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    select, button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 11px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button.active-on {
      border-color: var(--green);
      color: #6ee7b7;
    }

    /* Banner avviso scritto allo scadere esatto / apertura nuova candela */
    .candle-alert-banner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .candle-alert-banner .candle-badge {
      padding: 4px 9px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      background: #1e293b;
      color: #f8fafc;
    }

    .candle-alert-banner.active-signal {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.15);
      color: #ecfdf5;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.22);
    }

    .candle-alert-banner.active-signal .candle-badge {
      background: #059669;
    }

    .candle-alert-banner.blocked {
      border-color: var(--red);
      background: rgba(239, 68, 68, 0.15);
      color: #fef2f2;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.22);
    }

    .candle-alert-banner.blocked .candle-badge {
      background: #dc2626;
    }

    .candle-alert-banner.flash-now {
      transform: scale(1.01);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.9);
    }

    .asset-name-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .asset-symbol {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
    }

    .asset-category {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .asset-timer-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #7dd3fc;
      background: rgba(2, 132, 199, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      padding: 2px 7px;
      width: fit-content;
    }

    .asset-timer-row.closing-soon {
      color: #fde68a;
      background: rgba(217, 119, 6, 0.25);
      border-color: rgba(251, 191, 36, 0.7);
    }

    .dir-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .dir-buy {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }

    .dir-sell {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .dir-neutral {
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .block-tag {
      margin-top: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fca5a5;
    }

    .levels-box {
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .tp-val { color: #34d399; font-weight: 700; }
    .sl-val { color: #f87171; font-weight: 700; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand-group">
      <span class="badge-bx">BX</span>
      <strong>BINGX ELITE SIGNAL ROOM PRO</strong>
      <span id="global-candle-clock" class="asset-timer-row">⏱ --:-- · Prossima --:--:--</span>
    </div>

    <div class="controls">
      <label for="timeframe-select">TF:</label>
      <select id="timeframe-select">
        <option value="1m">1m</option>
        <option value="5m">5m</option>
        <option value="15m" selected>15m</option>
        <option value="1h">1h</option>
      </select>
      <button id="audio-toggle-btn" class="active-on" type="button">Audio: ON</button>
      <button id="refresh-now-btn" type="button">Aggiorna Segnali</button>
    </div>
  </div>

  <!-- Avviso scritto esatto allo scadere candela / apertura nuova candela -->
  <div id="new-candle-alert-box" class="candle-alert-banner idle" role="status" aria-live="polite">
    <span id="candle-alert-badge" class="candle-badge">IN ATTESA</span>
    <span id="candle-alert-text">In attesa della chiusura della candela corrente per emettere il segnale...</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Asset / Timer & Ora</th>
          <th>Direzione & Filtro</th>
          <th>Prezzo / Entry</th>
          <th>TP / SL</th>
          <th>Parametri</th>
        </tr>
      </thead>
      <tbody id="signals-tbody">
        <tr>
          <td colspan="5">Caricamento segnali sincronizzati...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    (() => {
      let audioEnabled = true;
      let latestSignals = [];
      let primarySignal = null;
      let lastPreparedCandleTs = null;
      let lastAnnouncedCandleTs = null;
      let preparedPayload = null;

      const tfSelect = document.getElementById("timeframe-select");
      const audioBtn = document.getElementById("audio-toggle-btn");
      const refreshBtn = document.getElementById("refresh-now-btn");
      const tbody = document.getElementById("signals-tbody");

      function getTfMinutes() {
        const parsed = parseInt(String(tfSelect.value || "15m").replace(/\D+/g, ""), 10);
        return Number.isNaN(parsed) || parsed <= 0 ? 15 : parsed;
      }

      function formatHHMMSS(ms) {
        return new Date(ms).toLocaleTimeString("it-IT", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
      }

      function formatMMSS(remainingMs) {
        const totalSec = Math.max(0, Math.floor(remainingMs / 1000));
        const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
        const s = String(totalSec % 60).padStart(2, "0");
        return `${m}:${s}`;
      }

      function playBeep() {
        if (!audioEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(920, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.16);
        } catch (_) {}
      }

      function renderSignalsTable(signals, countdownStr, nextOpenStr, closingSoon) {
        if (!Array.isArray(signals) || signals.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5">Nessun segnale disponibile.</td></tr>`;
          return;
        }

        tbody.innerHTML = signals.map((sig) => {
          const dirClass =
            sig.direction === "BUY" ? "dir-buy" :
            sig.direction === "SELL" ? "dir-sell" : "dir-neutral";
          const dirLabel =
            sig.direction === "BUY" ? "LONG (BUY)" :
            sig.direction === "SELL" ? "SHORT (SELL)" : "NEUTRAL";

          const blockHtml = sig.blocked
            ? `<div class="block-tag">⛔ ${sig.block_reason || "NON ENTRARE"}</div>`
            : "";

          return `
            <tr>
              <td>
                <div class="asset-name-cell">
                  <span class="asset-symbol">${sig.display_symbol}</span>
                  <span class="asset-category">${sig.category}</span>
                  <span class="asset-timer-row ${closingSoon ? "closing-soon" : ""}" data-asset-timer>
                    ⏱ ${countdownStr} · Apertura ${nextOpenStr}
                  </span>
                </div>
              </td>
              <td>
                <span class="dir-pill ${dirClass}">${dirLabel}</span>
                ${blockHtml}
              </td>
              <td><strong>${sig.entry}</strong></td>
              <td class="levels-box">
                <div>TP: <span class="tp-val">${sig.tp}</span></div>
                <div>SL: <span class="sl-val">${sig.sl}</span></div>
              </td>
              <td class="levels-box">
                <div>Lev: <strong>${sig.leverage}x</strong></div>
                <div>Certezza: <strong>${sig.certainty}%</strong></div>
              </td>
            </tr>
          `;
        }).join("");
      }

      async function fetchSignalsFromBackend() {
        const tf = `${getTfMinutes()}m`;
        try {
          const res = await fetch(`/api/candle-signals?timeframe=${encodeURIComponent(tf)}`, {
            cache: "no-store"
          });
          if (!res.ok) return;
          const data = await res.json();
          latestSignals = data.signals || [];
          primarySignal = data.primary_signal || null;

          const tfMs = getTfMinutes() * 60 * 1000;
          const now = Date.now();
          const nextOpen = (Math.floor(now / tfMs) + 1) * tfMs;
          const remMs = Math.max(0, nextOpen - now);
          renderSignalsTable(latestSignals, formatMMSS(remMs), formatHHMMSS(nextOpen), remMs <= 10000);
        } catch (_) {}
      }

      function writeNewCandleAlert(openTimeStr, tfMinutes, payload) {
        const box = document.getElementById("new-candle-alert-box");
        const badge = document.getElementById("candle-alert-badge");
        const text = document.getElementById("candle-alert-text");
        if (!box || !badge || !text) return;

        box.classList.remove("idle", "blocked", "active-signal");
        badge.textContent = `NUOVA CANDELA ${openTimeStr} (${tfMinutes}m)`;

        if (!payload || payload.blocked) {
          const reason = payload && payload.block_reason ? payload.block_reason : "NESSUN INGRESSO CONFERMATO";
          box.classList.add("blocked");
          text.textContent = `Nuova candela aperta alle ${openTimeStr} — NON ENTRARE (${reason}).`;
        } else {
          const sideText = payload.direction === "BUY" ? "LONG (BUY)" : "SHORT (SELL)";
          box.classList.add("active-signal");
          text.textContent = `Nuova candela alle ${openTimeStr} — ${payload.display_symbol} ${sideText} | Entry: ${payload.entry} | SL: ${payload.sl} | TP: ${payload.tp} (Leva ${payload.leverage}x)`;
        }

        box.classList.add("flash-now");
        setTimeout(() => box.classList.remove("flash-now"), 500);
        playBeep();
      }

      function tick() {
        const tfMinutes = getTfMinutes();
        const tfMs = tfMinutes * 60 * 1000;
        const now = Date.now();

        const currentCandleStart = Math.floor(now / tfMs) * tfMs;
        const nextCandleStart = currentCandleStart + tfMs;
        const remainingMs = Math.max(0, nextCandleStart - now);

        const countdownStr = formatMMSS(remainingMs);
        const nextOpenStr = formatHHMMSS(nextCandleStart);
        const currentOpenStr = formatHHMMSS(currentCandleStart);
        const closingSoon = remainingMs <= 10000;

        const globalClock = document.getElementById("global-candle-clock");
        if (globalClock) {
          globalClock.textContent = `⏱ ${countdownStr} · Apertura ${nextOpenStr}`;
          globalClock.classList.toggle("closing-soon", closingSoon);
        }

        document.querySelectorAll("[data-asset-timer]").forEach((el) => {
          el.textContent = `⏱ ${countdownStr} · Apertura ${nextOpenStr}`;
          el.classList.toggle("closing-soon", closingSoon);
        });

        // Prepara il segnale negli ultimi 350ms prima della chiusura della candela precedente
        if (remainingMs <= 350 && lastPreparedCandleTs !== nextCandleStart) {
          lastPreparedCandleTs = nextCandleStart;
          preparedPayload = primarySignal;
          fetchSignalsFromBackend();
        }

        // Allo scadere esatto (apertura nuova candela), scrive l'avviso in pagina
        if (now - currentCandleStart <= 250 && lastAnnouncedCandleTs !== currentCandleStart) {
          lastAnnouncedCandleTs = currentCandleStart;
          const payloadToAnnounce = preparedPayload || primarySignal;
          writeNewCandleAlert(currentOpenStr, tfMinutes, payloadToAnnounce);
          preparedPayload = null;
          fetchSignalsFromBackend();
        }
      }

      audioBtn.addEventListener("click", () => {
        audioEnabled = !audioEnabled;
        audioBtn.textContent = audioEnabled ? "Audio: ON" : "Audio: OFF";
        audioBtn.classList.toggle("active-on", audioEnabled);
      });

      refreshBtn.addEventListener("click", () => {
        fetchSignalsFromBackend();
      });

      tfSelect.addEventListener("change", () => {
        lastPreparedCandleTs = null;
        lastAnnouncedCandleTs = null;
        fetchSignalsFromBackend();
      });

      setInterval(tick, 100);
      document.addEventListener("DOMContentLoaded", () => {
        tick();
        fetchSignalsFromBackend();
      });
    })();
  </script>
</body>
</html>
