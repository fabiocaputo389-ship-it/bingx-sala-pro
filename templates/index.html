<!-- Controlli Timeframe + Chiusura Candela -->
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
  <select id="tfSelect" style="background:#141e33;color:#f8fafc;border:1px solid #334155;border-radius:10px;padding:6px 10px;font-weight:700;">
    <option value="1m">1m</option>
    <option value="5m">5m</option>
    <option value="15m" selected>15m</option>
    <option value="1h">1h</option>
    <option value="4h">4h</option>
    <option value="1d">1d</option>
  </select>
  <div style="font-size:11px;color:#cbd5e1;text-align:right;">
    Chiusura candela: <strong id="candleCloseLocal">--:--:--</strong> (<span id="candleCloseUtc">--:--:-- UTC</span>)
  </div>
</div>

<!-- Score Segnale Modificabile + Parametri Indicatori -->
<div style="background:#141e33;border:1px solid #233252;border-radius:14px;padding:12px;margin-bottom:12px;font-size:12px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
    <span><strong>SCORE SEGNALE:</strong> <span id="scoreReadout">0 / 65</span></span>
    <span id="scoreStatusBadge" style="font-weight:800;color:#fbbf24;">SOGLIA MODIFICABILE</span>
  </div>

  <label style="display:block;color:#94a3b8;font-size:11px;margin-bottom:4px;">
    Score Minimo Richiesto (0 - 100): <strong id="minScoreLabel">65</strong>
  </label>
  <input id="minScoreInput" type="range" min="0" max="100" value="65" style="width:100%;margin-bottom:10px;" />

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;">
    <div>
      <span style="color:#94a3b8;font-size:10px;">RSI Periodo</span>
      <input id="rsiPeriodInput" type="number" min="2" max="100" value="14" style="width:100%;background:#090d16;color:#fff;border:1px solid #334155;border-radius:8px;padding:5px;" />
    </div>
    <div>
      <span style="color:#94a3b8;font-size:10px;">MACD (F/S/Sig)</span>
      <div style="display:flex;gap:3px;">
        <input id="macdFastInput" type="number" value="12" style="width:33%;background:#090d16;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px;" />
        <input id="macdSlowInput" type="number" value="26" style="width:33%;background:#090d16;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px;" />
        <input id="macdSigInput" type="number" value="9" style="width:33%;background:#090d16;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px;" />
      </div>
    </div>
    <div>
      <span style="color:#94a3b8;font-size:10px;">EMA (Fast/Slow)</span>
      <div style="display:flex;gap:3px;">
        <input id="emaFastInput" type="number" value="20" style="width:50%;background:#090d16;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px;" />
        <input id="emaSlowInput" type="number" value="50" style="width:50%;background:#090d16;color:#fff;border:1px solid #334155;border-radius:6px;padding:4px;" />
      </div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;color:#94a3b8;font-size:11px;margin-bottom:8px;">
    <span id="macdDetail">MACD: --</span>
    <span id="emaAtrDetail">EMA: -- | ATR: --</span>
  </div>

  <button id="saveParamsBtn" type="button" style="width:100%;background:#2563eb;color:#fff;border:none;border-radius:10px;padding:9px;font-weight:800;cursor:pointer;">
    💾 SALVA SCORE E PARAMETRI
  </button>
</div>
