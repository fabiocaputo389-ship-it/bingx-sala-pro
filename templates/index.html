<div id="vip-scanner-panel" style="background:#111622;color:#e6edf7;padding:14px;border-radius:10px;margin:12px 0;font-family:monospace;">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
    <strong>BINGX VIP SCANNER LIVE</strong>
    <div>
      <select id="vip-tf" style="background:#1b2436;color:#fff;padding:6px;border-radius:6px;">
        <option value="1m">1m</option>
        <option value="5m" selected>5m</option>
        <option value="15m">15m</option>
        <option value="1h">1h</option>
      </select>
      <span id="vip-acc-info" style="margin-left:10px;color:#f5b041;">Balance: 0.00 | Lev: 20x</span>
    </div>
  </div>
  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;min-width:680px;font-size:12px;">
      <thead>
        <tr style="color:#8fa1bd;border-bottom:1px solid #233047;text-align:left;">
          <th style="padding:8px;">Pair</th>
          <th style="padding:8px;">Price</th>
          <th style="padding:8px;">Signal</th>
          <th style="padding:8px;">Score</th>
          <th style="padding:8px;">RSI</th>
          <th style="padding:8px;">Z-Score</th>
          <th style="padding:8px;">OBI %</th>
          <th style="padding:8px;">TP</th>
          <th style="padding:8px;">SL</th>
        </tr>
      </thead>
      <tbody id="vip-tbody"></tbody>
    </table>
  </div>
</div>

<script>
async function refreshVipScanner() {
  const tf = document.getElementById("vip-tf").value;
  const res = await fetch(`/api/vip-scan?tf=${encodeURIComponent(tf)}`);
  const data = await res.json();

  if (data.account) {
    document.getElementById("vip-acc-info").textContent =
      `Balance: ${data.account.balance.toFixed(2)} USDT | Lev: ${data.account.leverage}x | 24h PnL: ${data.account.realized_24h >= 0 ? "+" : ""}${data.account.realized_24h.toFixed(4)}`;
  }

  const tbody = document.getElementById("vip-tbody");
  tbody.innerHTML = (data.signals || []).map(s => {
    const color = s.signal.includes("BUY") ? "#00e676" : (s.signal.includes("SELL") ? "#ff3b5c" : "#94a3b8");
    return `
      <tr style="border-bottom:1px solid #1a2334;">
        <td style="padding:8px;"><strong>${s.symbol}</strong></td>
        <td style="padding:8px;">${s.price}</td>
        <td style="padding:8px;color:${color};font-weight:700;">${s.signal}</td>
        <td style="padding:8px;">${s.score} (${s.confidence}%)</td>
        <td style="padding:8px;">${s.rsi}</td>
        <td style="padding:8px;">${s.z_score}σ</td>
        <td style="padding:8px;">${s.obi}%</td>
        <td style="padding:8px;color:#00e676;">${s.tp || "-"}</td>
        <td style="padding:8px;color:#ff3b5c;">${s.sl || "-"}</td>
      </tr>
    `;
  }).join("");
}

document.getElementById("vip-tf").addEventListener("change", refreshVipScanner);
setInterval(refreshVipScanner, 3000);
refreshVipScanner();
</script>
